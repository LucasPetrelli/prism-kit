[project]
name = "prism-kit"
version = "0.1.0"
description = "Prism Kit firmware development tooling"
requires-python = ">=3.10"
dependencies = [
    # Zephyr build prerequisites (from zephyr/scripts/requirements-base.txt)
    "anytree",
    "canopen",
    "jsonschema",
    "packaging",
    "patool>=2.0.0",
    "psutil>=5.6.6",
    "pyelftools>=0.29",
    "pykwalify",
    "pylink-square",
    "pyserial",
    "PyYAML>=6.0",
    "requests>=2.32.4",
    "reuse",
    "ruff",
    "semver",
    "tqdm>=4.67.1",
    "west",
]

[project.scripts]
build = "scripts.firmware.build:cli"
flash = "scripts.firmware.flash:cli"
flush-worktrees = "scripts.maintenance.flush_worktrees:cli"
format = "scripts.checks.format:cli"
lint = "scripts.checks.lint:cli"
lint-python = "scripts.checks.lint_python:cli"
smoke-test = "scripts.device.smoke_test:cli"
unit-tests = "scripts.checks.unit_tests:cli"
rainbow = "scripts.device.rainbow:cli"
rainbow2 = "scripts.device.rainbow2:cli"
rainbow3 = "scripts.device.rainbow3:cli"
rainbow4 = "scripts.device.rainbow4:cli"
rainbow5 = "scripts.device.rainbow5:cli"
fade = "scripts.device.fade:cli"
gradient = "scripts.device.gradient:cli"
set-color = "scripts.device.set_color:cli"
install-git-hooks = "scripts.maintenance.install_git_hooks:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
